<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画师串管理器</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app-shell">
  <aside class="sidebar"><h1>画师串管理器</h1><div class="side-title">我的分组 <button id="groups-toggle" class="icon-button">⌄</button></div><nav id="group-list" class="group-list"></nav><div class="side-actions"><button class="primary" id="new-group">＋ 新建分组</button><button id="import-data">导入旧数据…</button><button id="export-data">导出数据…</button><label class="topmost"><input type="checkbox" id="topmost"> 窗口置顶</label></div></aside>
  <main class="main-column"><header class="main-head"><div><h2 id="group-title">画师串管理器</h2><p id="group-subtitle"></p></div><div class="head-actions"><button id="edit-group">编辑分组</button><button class="danger" id="delete-group">删除分组</button></div></header>
    <section class="toolbar"><input id="search" placeholder="搜索全部分组的标签 / 链接…"><span id="count">0 条</span><button class="primary" id="add-one">＋ 新增</button><button id="add-batch">批量添加</button><select id="sort"><option value="manual">手动顺序</option><option value="name_asc">名称 A–Z</option><option value="name_desc">名称 Z–A</option><option value="weight_desc">权重从高到低</option><option value="weight_asc">权重从低到高</option><option value="shuffle">稳定打散</option></select></section>
    <section id="cards-viewport" class="cards-viewport"><div id="cards-spacer" class="cards-spacer"><div id="cards-grid" class="cards-grid"></div></div></section><footer id="status" class="status"></footer></main>
  <aside class="combo-panel"><h2>提示词组合</h2><p class="combo-hint">在中间条目点「＋组合」添加，也可一键加入当前分组。</p><div id="combo-scroll" class="combo-scroll"></div><div class="combo-actions"><button id="select-group">加入当前分组</button><button id="clear-combo">清空</button><label>分隔符 <input id="separator" value=", " maxlength="8"></label></div><section class="output-card"><textarea id="output" readonly></textarea><div class="output-actions"><span id="selected-count">已选择 0 项</span><div><button id="save-combo">记录组合</button><button class="primary" id="copy-combo">复制组合</button><button id="edit-combo">编辑组合</button></div></div></section></aside>
 </div><dialog id="modal"></dialog><div id="toast" class="toast"></div><script src="renderer.js"></script></body></html>
